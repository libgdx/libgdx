buildscript {
	dependencies {
		classpath "org.docstr.gwt:org.docstr.gwt.gradle.plugin:${versions.gwtPlugin}"
	}
}

apply plugin: "org.docstr.gwt"

dependencies {
	implementation project(":tests:gdx-tests")
	implementation project(":backends:gdx-backend-gwt")
	implementation project(":extensions:gdx-box2d-parent:gdx-box2d-gwt")
	compileOnly "org.gwtproject:gwt-dev:${versions.gwt}"
}

gwt {
	gwtVersion = versions.gwt // Should match the gwt version used for building the gwt backend
	maxHeapSize = "1G" // Default 256m is not enough for gwt compiler. GWT is HUNGRY
	minHeapSize = "1G"

	modules = [
		"com.badlogic.gdx.tests.gwt.GdxTestsGwt"
	]

	// The GWT compiler needs the Java sources (and .gwt.xml modules) of the libGDX projects, not just their jars.
	// gdx-box2d only contributes its resources: its Java sources are replaced by gdx-box2d-gwt.
	gwtSourceDirs.from(
			project(":gdx").files("src", "res"),
			project(":backends:gdx-backend-gwt").files("src", "res"),
			project(":extensions:gdx-box2d-parent:gdx-box2d").files("res"),
			project(":extensions:gdx-box2d-parent:gdx-box2d-gwt").files("src", "res"),
			project(":tests:gdx-tests").files("src", "res"))

	compiler {
		strict = true
	}

	devMode {
		// Serve the tests from the same directory the asset preloader writes to (see gdx.assetpath in GdxTestsGwt.gwt.xml)
		war = file("war")
		port = 8080
	}
}

// Resets war/ to the webapp template before dev mode serves it. Leftovers there (e.g. WEB-INF/lib jars from older
// builds) would be loaded by the dev mode web server and can break it. Keeps the assets copied by the preloader.
tasks.register("prepareDevWar", Sync) {
	from "webapp"
	into "war"
	preserve {
		include "assets/**"
	}
}

tasks.named("gwtDevMode") {
	dependsOn "prepareDevWar"
}

tasks.register("superDev") {
	group = "LibGDX"
	description = "Runs the GWT tests in Super Dev Mode on http://localhost:8080"
	dependsOn "gwtDevMode"
}

tasks.register("dist", Sync) {
	group = "LibGDX"
	description = "Compiles the GWT tests into a deployable site in build/dist"
	from tasks.named("gwtCompile").flatMap { it.war }
	from "webapp"
	// Only the assets copied by the preloader, not dev mode leftovers
	from("war") {
		include "assets/**"
	}
	into layout.buildDirectory.dir("dist")
}

eclipse {
	classpath {
		containers += [
			'com.google.gwt.eclipse.core.GWT_CONTAINER',
			'com.gwtplugins.gwt.eclipse.core.GWT_CONTAINER'
		]
	}
}
