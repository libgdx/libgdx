apply plugin: "java"

if (JavaVersion.current().isJava9Compatible()) {
	compileJava {
		options.release = versions.java
	}
}
java {
	sourceCompatibility = versions.java
	targetCompatibility = versions.java
}

sourceSets.main.java.srcDirs = ["src"]
sourceSets.main.resources.srcDirs = ["res"]
sourceSets.test.java.srcDirs = ["test"]
sourceSets.test.resources.srcDirs = ["test"]

compileJava {
	options.fork = true
	options.incremental = true
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("generateIOSHeaders", JavaCompile) {
	def robovmProject = project(":backends:gdx-backend-robovm")
	source(["IOSGLES20", "IOSGLES30"].collect {
		robovmProject.file("src/com/badlogic/gdx/backends/iosrobovm/${it}.java")
	})

	classpath = robovmProject.sourceSets.main.runtimeClasspath

	destinationDirectory.set(layout.buildDirectory.dir("iosgl-classes"))
	options.headerOutputDirectory.set(layout.buildDirectory.dir("iosgl-headers"))
}

tasks.register("regenerateIOSHeader", Copy) {
	from generateIOSHeaders
	include "*IOSGLES*.h"
	into "jni/iosgl"
	rename ".*GLES([0-9]*)\\.h", "iosgl\$1.h"
}

task validateIOSHeader {
	dependsOn regenerateIOSHeader
	def iosglDir = file("jni/iosgl")
	doLast {
		for (name in ["iosgl20", "iosgl30"]) {
			def headerContent = new File(iosglDir, "${name}.h").readLines()
			def cppContent = new File(iosglDir, "${name}.cpp").readLines()
			for (headerLine in headerContent) {
				if (headerLine.startsWith("JNIEXPORT")) {
					if (!cppContent.contains(headerLine)) {
						throw new RuntimeException("Header file for $name contains method $headerLine, which is not contained in the implementation")
					}
				}
			}

			for (contentLine in cppContent) {
				if (contentLine.startsWith("JNIEXPORT")) {
					if (!headerContent.contains(contentLine)) {
						throw new RuntimeException("Implementation file for $name contains method $contentLine, which is not contained in the header")
					}
				}
			}
		}
	}
}

tasks.named("check") {
	dependsOn tasks.named("validateIOSHeader")
}

dependencies {
	testImplementation libraries.junit
	api "com.badlogicgames.jnigen:jnigen-loader:3.1.3"
}

test {
	testLogging {
		events "passed", "skipped", "failed", "standardOut", "standardError"
	}
}

processResources.duplicatesStrategy = DuplicatesStrategy.EXCLUDE

apply plugin: "com.badlogicgames.jnigen.jnigen-gradle"
jnigen {
	sharedLibName = "gdx"
	multiThreadedCompile = true

	all {
		headerDirs = [
			"jni",
			"jni/etc1",
			"jni/gdx2d"
		]
		cIncludes = ["jni/gdx2d/*.c"]
		cppIncludes = ["jni/etc1/*.cpp"]
	}

	addWindows(x64, ARM, MSVC)
	addWindows(x32, x86)
	addWindows(x64, x86)

	addLinux(x64, x86)
	addLinux(x32, ARM)
	addLinux(x64, ARM)
	addLinux(x64, RISCV)
	addAndroid() {
		linkerFlags += ["-llog"]
	}
	addMac(x64, x86)
	addMac(x64, ARM)
	addIOS() {
		headerDirs += ["jni/iosgl"]
		cppIncludes = ["jni/iosgl/*.cpp"]
		linkerFlags += [
			"-undefined",
			"dynamic_lookup"
		]
	}
	robovm {
		extraXCFramework("../../libs/ios32/ObjectAL.xcframework")
	}
}

tasks.named("jnigenBuildAllIOS") {
	dependsOn tasks.named("regenerateIOSHeader")
}

artifacts {
	[
		jnigenPackageAllAndroid,
		jnigenPackageAllIOS,
		jnigenPackageAllDesktop
	].forEach {packageTask ->
		packageTask.getOutputs().getFiles().each { file ->
			archives(file) {
				builtBy(packageTask)
			}
		}
	}
}
